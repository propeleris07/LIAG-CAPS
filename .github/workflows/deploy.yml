name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that all pages and assets exist
        run: |
          for f in index.html css/style.css js/app.js js/products.js assets/favicon.svg; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html .nojekyll css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
