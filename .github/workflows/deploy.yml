name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that all pages and assets exist
        run: |
          for f in index.html css/style.css js/app.js js/products.js assets/favicon.svg assets/img/cap-sun.jpg assets/img/cap-hope.jpg assets/img/cap-courage.jpg assets/img/blocks-hero.jpg assets/img/blocks-winter.jpg; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html .nojekyll css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Wait for the new version to be live
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$SITE_URL" -o /dev/null && break
            sleep 5
          done
      - name: Smoke-test the live site
        run: node tests/smoke.js "${{ needs.deploy.outputs.page_url }}"
