<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lithuania is Already Great — Caps</title>
  <meta name="description" content="Caps with the slogan “Lithuania is Already Great”. Embroidered, Baltic-made attitude.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="demo-banner" role="note">
    Demo storefront: no real payments are taken and no orders are shipped.
  </div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="Home">
        <span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Lithuania is <strong>Already Great</strong></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/shop" data-nav="shop">Shop</a>
        <a href="#/about" data-nav="about">About</a>
        <a href="#/cart" data-nav="cart" class="cart-link">Cart <span class="cart-count" id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> Lithuania is Already Great. Prices in EUR, VAT included.</p>
      <p class="muted">This is a demo storefront. Checkout does not charge cards or create real orders.</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
